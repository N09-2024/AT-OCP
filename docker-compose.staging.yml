version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: at-ocp-postgres-staging
    restart: unless-stopped
    environment:
      POSTGRES_DB: at_ocp_staging
      POSTGRES_USER: staging_user
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U staging_user -d at_ocp_staging"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - at-ocp-network

  backend:
    image: at-ocp-backend:staging
    container_name: at-ocp-backend-staging
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      ai-service:
        condition: service_started
    environment:
      SPRING_PROFILES_ACTIVE: staging
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: at_ocp_staging
      DB_USERNAME: staging_user
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      FILE_UPLOAD_PATH: /app/uploads
    volumes:
      - uploads_data:/app/uploads
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - at-ocp-network

  nginx:
    image: nginx:1.25-alpine
    container_name: at-ocp-nginx-staging
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
    networks:
      - at-ocp-network

  # AI Microservice (FastAPI - CrewAI / LangChain)
  ai-service:
    image: at-ocp-ai-service:staging
    container_name: at-ocp-ai-service-staging
    restart: unless-stopped
    environment:
      LLM_PROVIDER: ${LLM_PROVIDER:-GEMINI}
      LLM_MODEL: ${LLM_MODEL:-gemini-2.5-flash}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-${GOOGLE_API_KEY:-}}
      RAG_ENABLED: "true"
      CREWAI_TELEMETRY_OPT_OUT: "true"
      OTEL_SDK_DISABLED: "true"
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 120s
    networks:
      - at-ocp-network

volumes:
  postgres_data:
    driver: local
  uploads_data:
    driver: local

networks:
  at-ocp-network:
    driver: bridge
