version: '3.8'

services:
  # Base de données PostgreSQL uniquement (pour le développement local)
  postgres:
    image: postgres:16-alpine
    container_name: at-ocp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: at_ocp_db
      POSTGRES_USER: at_ocp_user
      POSTGRES_PASSWORD: at_ocp_secret
    ports:
      - "5432:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U at_ocp_user -d at_ocp_db"]
      interval: 5s
      timeout: 3s
      retries: 10

  # AI Microservice (FastAPI - CrewAI / LangChain) — dev avec hot-reload
  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: at-ocp-ai-service-dev
    restart: unless-stopped
    environment:
      LLM_PROVIDER: ${LLM_PROVIDER:-MOCK}
      LLM_MODEL: ${LLM_MODEL:-gemini-2.5-flash}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-${GOOGLE_API_KEY:-}}
      RAG_ENABLED: "true"
      CREWAI_TELEMETRY_OPT_OUT: "true"
      OTEL_SDK_DISABLED: "true"
    ports:
      - "8000:8000"
    volumes:
      # Hot-reload : le code source est monté en lecture dans le conteneur
      - ./ai-service/app:/app/app:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8000/health || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  postgres_dev_data:
    driver: local

