spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/ocp_at_dev
    username: postgres
    password: password
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    baseline-on-migrate: true

logging:
  level:
    root: INFO
    com.ocp.at: DEBUG
    org.springframework.security: DEBUG
