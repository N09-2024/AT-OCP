spring:
  application:
    name: at-backend
  profiles:
    active: dev
  jpa:
    open-in-view: false
  servlet:
    multipart:
      enabled: true
      max-file-size: 20MB
      max-request-size: 25MB
      file-size-threshold: 2KB

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: 86400000
    refresh-expiration-ms: 604800000
  security:
    max-login-attempts: 5
    password:
      min-length: 8
  storage:
    location: uploads

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health, info

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
  level:
    root: INFO
